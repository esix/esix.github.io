      <circle cx="7.5" cy="8" r="1.2" fill="#0f172a"/>
      <circle cx="12.5" cy="8" r="1.2" fill="#0f172a"/>
      <path d="M7 12.5 Q10 15 13 12.5" fill="none" stroke="#0f172a" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <g id="playerGoal">
      <use href="#player"/>
      <circle cx="10" cy="10" r="9.2" fill="none" stroke="#facc15" stroke-width="2"/>
    </g>
    <g id="base">
      <use href="#wall" x="0" y="0"/>
      <use href="#wall" x="20" y="0"/>
      <use href="#wall" x="40" y="0"/>
      <use href="#wall" x="60" y="0"/>
      <use href="#wall" x="0" y="20"/>
      <use href="#floor" x="20" y="20"/>
      <use href="#floor" x="40" y="20"/>
      <use href="#wall" x="60" y="20"/>
      <use href="#wall" x="0" y="40"/>
