      .edge { stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; }
      .push { stroke: #d97706; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
      .card { fill: #fff; stroke: #334155; stroke-width: 2.5; }
      .goal .card { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3.2; }
      .state-title { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; text-anchor: middle; }
      .state-code { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; text-anchor: middle; }
      .legend { font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .legend-title { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .gridline { stroke: #e2e8f0; stroke-width: 1; }
