<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 980" role="img" aria-labelledby="title desc">
  <title id="title">Граф состояний level0</title>
  <desc id="desc">Пятнадцать состояний первого уровня Sokoban. Каждая вершина содержит мини-карту состояния, номер и бинарный код.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>

    <g id="floor">
      <rect width="20" height="20" rx="3" fill="#f8fafc" stroke="#dbe3ef"/>
      <path d="M2 18 L18 2" stroke="#eef2f7" stroke-width="1.5"/>
    </g>
    <g id="wall">
      <rect width="20" height="20" rx="3" fill="#64748b"/>
      <path d="M2 6 H18 M2 14 H18 M6 2 V18 M14 2 V18" stroke="#475569" stroke-width="1.4" opacity=".75"/>
    </g>
    <g id="target">
      <use href="#floor"/>
      <circle cx="10" cy="10" r="6" fill="#fde68a" stroke="#d97706" stroke-width="1.6"/>
      <circle cx="10" cy="10" r="2.4" fill="#d97706"/>
    </g>
    <g id="box">
      <rect x="2" y="2" width="16" height="16" rx="2.5" fill="#b7791f" stroke="#7c2d12" stroke-width="1.6"/>
      <path d="M5 5 L15 15 M15 5 L5 15" stroke="#f6d58f" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="boxGoal">
      <use href="#box"/>
      <circle cx="10" cy="10" r="4.2" fill="#22c55e" stroke="#ecfdf5" stroke-width="1.2"/>
    </g>
    <g id="player">
