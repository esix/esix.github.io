      <use href="#floor" x="40" y="40"/>
      <use href="#wall" x="60" y="40"/>
      <use href="#wall" x="0" y="60"/>
      <use href="#target" x="20" y="60"/>
      <use href="#floor" x="40" y="60"/>
      <use href="#wall" x="60" y="60"/>
      <use href="#wall" x="0" y="80"/>
      <use href="#wall" x="20" y="80"/>
      <use href="#wall" x="40" y="80"/>
      <use href="#wall" x="60" y="80"/>
    </g>

    <style>
